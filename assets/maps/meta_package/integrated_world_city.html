<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الخريطة المتكاملة - عالم + مدينة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1210;color:#d8dcc8;font-family:'Cairo';height:100vh;display:flex;flex-direction:column}
header{background:#1a1f1a;border-bottom:2px solid #3a4a2a;padding:10px 16px;display:flex;justify-content:space-between}
.btn{background:#2a3322;border:1px solid #4a5a3a;color:#c8d8a8;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:700;font-size:11px}
.btn.primary{background:#4a6a2a;color:#fff}
.layout{flex:1;display:flex;overflow:hidden}
.world{flex:1;position:relative;background:#0a0e0a}
.world canvas{width:100%;height:100%;display:block}
.city-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;height:80%;background:#121611;border:3px solid #4a6a2a;border-radius:12px;overflow:hidden;display:none;z-index:10;box-shadow:0 20px 60px rgba(0,0,0,0.8)}
.city-popup.active{display:flex;flex-direction:column}
.city-header{background:#1c221b;padding:8px 12px;display:flex;justify-content:space-between;border-bottom:1px solid #2a3322}
.city-header h2{font-size:14px;color:#e8dca0}
.city-content{flex:1;display:flex}
.city-map{flex:1;background:#0a0e0a;position:relative}
.city-map canvas{width:100%;height:100%}
.city-info{width:260px;background:#161a15;border-right:2px solid #2a3322;padding:10px;overflow-y:auto}
.bld{font-size:10px;background:#1a1f1a;border:1px solid #2a3322;padding:4px 6px;border-radius:4px;margin-bottom:3px;display:flex;gap:6px;align-items:center}
.hud{position:absolute;top:8px;left:8px;background:rgba(15,18,16,0.9);border:1px solid #2a3322;padding:6px 8px;border-radius:4px;font-family:'JetBrains Mono';font-size:10px}
</style>
</head>
<body>
<header>
<h1>🗺️ الخريطة المتكاملة | العالم الكبير + المدن المودرن جواها</h1>
<div style="display:flex;gap:6px">
<button class="btn" onclick="generateWorld()">🌍 توليد عالم</button>
<button class="btn primary" onclick="exportIntegrated()">⚙️ Export Integrated Godot</button>
</div>
</header>
<div class="layout">
<div class="world" id="world">
<canvas id="worldCanvas"></canvas>
<div class="hud" id="hud">اضغط على أي مدينة زجاجية للدخول جواها - المدن المودرن جزء من الخريطة الكبرى</div>
<div class="city-popup" id="cityPopup">
<div class="city-header"><h2 id="cityTitle">مدينة</h2><button class="btn" onclick="closeCity()">✕ إغلاق والرجوع للعالم</button></div>
<div class="city-content">
<div class="city-map"><canvas id="cityCanvas"></canvas></div>
<div class="city-info" id="cityInfo"></div>
</div>
</div>
</div>
</div>
<script>
const TERRAIN_COLORS={deep_sea:'#0a2e5a',shallow_sea:'#1e6fa6',beach:'#e6d5a7',plains:'#8ab66a',forest:'#2a6a2a',desert:'#d9b56a',hills:'#a8a87a',mountain:'#7a7a7a'};
const BUILDINGS_MODERN=[
{id:'GLASS_TOWER',ar:'برج زجاجي',icon:'🏢',color:'#60a5fa',h:40},
{id:'MALL',ar:'مول تجاري',icon:'🛍️',color:'#fbbf24',h:8},
{id:'RES_HIGH',ar:'سكني فاخر',icon:'🏠',color:'#a78bfa',h:20},
{id:'SHOP',ar:'محلات شارع',icon:'🏪',color:'#fb923c',h:2},
{id:'HOSPITAL',ar:'مستشفى مودرن',icon:'🏥',color:'#f87171',h:6},
{id:'MOSQUE',ar:'مسجد مودرن',icon:'🕌',color:'#4ade80',h:10},
{id:'PARK',ar:'حديقة',icon:'🌳',color:'#34d399',h:1},
{id:'POLICE',ar:'قسم شرطة',icon:'🚔',color:'#38bdf8',h:3},
];

let cities=[], worldCanvas, wctx, cityCanvas, cctx, cam={x:128,y:128}, zoom=1.5, selected=null;

function rng(seed){let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;return ()=>{h+=0x6D2B79F5;let t=Math.imul(h^h>>>15,h|1);t^=t+Math.imul(t^h>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};}
let rand=rng("integrated_"+Date.now());

function generateWorld(){
  cities=[];
  let names=["القاهرة الجديدة - العاصمة الإدارية","العلمين - أبراج زجاجية","المنصورة الجديدة","أسوان الجديدة","الجلالة - مدينة جبلية","شرق بورسعيد","ناصر غرب أسيوط","غرب قنا"];
  for(let i=0;i<12;i++){
    let x=20+rand()*216, y=20+rand()*216;
    let type=i<2?'CAPITAL_GLASS': i<5?'MODERN_COAST':'MODERN_NEW';
    let city={
      id:'city_'+i,
      name:names[i%names.length]+(i>=names.length?` ${i+1}`:''),
      x,y,
      type,
      pop:5000+Math.floor(rand()*15000),
      buildings:[],
      isModern:true
    };
    // Generate modern glass city interior
    let count= type==='CAPITAL_GLASS'? 18 : 12;
    for(let b=0;b<count;b++){
      let bType=BUILDINGS_MODERN[Math.floor(rand()*BUILDINGS_MODERN.length)];
      city.buildings.push({
        type:bType.id,
        ar:bType.ar,
        icon:bType.icon,
        color:bType.color,
        x:(rand()-0.5)*180,
        y:(rand()-0.5)*180,
        floors:5+Math.floor(rand()*35),
        glass:true,
        shops: bType.id==='GLASS_TOWER' || bType.id==='SHOP' ? Math.floor(rand()*6)+2 : 0,
      });
    }
    cities.push(city);
  }
  drawWorld();
}

function drawWorld(){
  if(!wctx) return;
  wctx.fillStyle='#0e1a0e'; wctx.fillRect(0,0,worldCanvas.width,worldCanvas.height);
  // Simple terrain
  for(let y=0;y<256;y+=4){for(let x=0;x<256;x+=4){
    let h=Math.sin(x*0.05)*0.3+Math.cos(y*0.05)*0.3+0.5;
    wctx.fillStyle=h<0.3?'#0a2e5a':h<0.4?'#1e6fa6':h<0.7?'#8ab66a':'#7a7a7a';
    let s=worldToScreen(x,y); wctx.fillRect(s.x,s.y,3,3);
  }}
  // roads between cities
  wctx.strokeStyle='#3a3a3a'; wctx.lineWidth=2;
  cities.forEach((c,i)=>{
    let nearest=cities.map((o,j)=>({j,o,d:Math.hypot(o.x-c.x,o.y-c.y)})).filter(v=>v.j!==i).sort((a,b)=>a.d-b.d).slice(0,1);
    nearest.forEach(n=>{
      let s1=worldToScreen(c.x,c.y), s2=worldToScreen(n.o.x,n.o.y);
      wctx.beginPath(); wctx.moveTo(s1.x,s1.y); wctx.lineTo(s2.x,s2.y); wctx.stroke();
    });
  });
  // cities as modern glass icons
  cities.forEach(c=>{
    let s=worldToScreen(c.x,c.y);
    // glow for modern city
    wctx.fillStyle='#60a5fa44'; wctx.beginPath(); wctx.arc(s.x,s.y,20,0,Math.PI*2); wctx.fill();
    wctx.fillStyle='#60a5fa'; wctx.fillRect(s.x-6,s.y-10,12,20);
    wctx.fillStyle='#ffffff88'; wctx.fillRect(s.x-4,s.y-8,3,16);
    wctx.fillStyle='#e8dca0'; wctx.font='11px Cairo'; wctx.fillText(c.name, s.x+14, s.y-6);
    wctx.fillStyle='#8aa86a'; wctx.font='9px JetBrains Mono'; wctx.fillText(`${c.buildings.length} مبنى زجاجي`, s.x+14, s.y+6);
  });
}

function worldToScreen(x,y){return {x:(x-cam.x)*zoom+worldCanvas.width/2,y:(y-cam.y)*zoom+worldCanvas.height/2};}
function screenToWorld(sx,sy){return {x:(sx-worldCanvas.width/2)/zoom+cam.x,y:(sy-worldCanvas.height/2)/zoom+cam.y};}

function openCity(i){
  selected=cities[i];
  document.getElementById('cityPopup').classList.add('active');
  document.getElementById('cityTitle').textContent=`🏙️ ${selected.name} - ${selected.pop} ساكن | ${selected.buildings.length} مبنى زجاجي`;
  drawCity(selected);
  document.getElementById('cityInfo').innerHTML=`
    <div style="font-size:11px;color:#c8d8a8;margin-bottom:8px">المدينة جزء من الخريطة الكبرى 256x256 - تظهر عند التقريب</div>
    ${selected.buildings.map(b=>`
      <div class="bld" style="border-color:${b.color}"><span>${b.icon}</span><div><b>${b.ar}</b><div style="font-size:9px;color:#8aa86a">${b.floors} دور | واجهة زجاج | ${b.shops?b.shops+' محلات':''}</div></div></div>
    `).join('')}
    <div style="margin-top:8px;background:#1a1f1a;padding:6px;border-radius:4px;font-size:10px">
      <b>شوارع واسعة:</b><br>
      • بوليفارد رئيسي 30م<br>
      • شوارع جانبية 12م<br>
      • أرصفة محلات 6م<br>
      • طرق أسفلت بعلامات صفراء
    </div>
  `;
}

function drawCity(c){
  if(!cctx) return;
  cctx.fillStyle='#0f1410'; cctx.fillRect(0,0,cityCanvas.width,cityCanvas.height);
  // grid roads wide
  cctx.strokeStyle='#2a2a2a'; cctx.lineWidth=12;
  for(let i=-3;i<=3;i++){
    cctx.beginPath(); cctx.moveTo(cityCanvas.width/2+i*90,0); cctx.lineTo(cityCanvas.width/2+i*90,cityCanvas.height); cctx.stroke();
    cctx.beginPath(); cctx.moveTo(0,cityCanvas.height/2+i*90); cctx.lineTo(cityCanvas.width,cityCanvas.height/2+i*90); cctx.stroke();
  }
  // yellow lines
  cctx.strokeStyle='#e8c84a'; cctx.lineWidth=1; cctx.setLineDash([10,10]);
  for(let i=-3;i<=3;i++){
    cctx.beginPath(); cctx.moveTo(cityCanvas.width/2+i*90,0); cctx.lineTo(cityCanvas.width/2+i*90,cityCanvas.height); cctx.stroke();
    cctx.beginPath(); cctx.moveTo(0,cityCanvas.height/2+i*90); cctx.lineTo(cityCanvas.width,cityCanvas.height/2+i*90); cctx.stroke();
  }
  cctx.setLineDash([]);
  // buildings glass
  c.buildings.forEach(b=>{
    let x=cityCanvas.width/2+b.x, y=cityCanvas.height/2+b.y;
    cctx.fillStyle=b.color+'55';
    cctx.fillRect(x-18,y-18,36,36);
    cctx.strokeStyle=b.color; cctx.lineWidth=1.5; cctx.strokeRect(x-18,y-18,36,36);
    // glass reflection
    cctx.fillStyle='#ffffff66'; cctx.fillRect(x-16,y-16,6,32);
    cctx.fillStyle='#e8dca0'; cctx.font='14px Arial'; cctx.fillText(b.icon, x-7, y+5);
    cctx.fillStyle='#8aa86a'; cctx.font='8px JetBrains Mono'; cctx.fillText(b.floors+'F', x-10, y+22);
  });
}

function closeCity(){document.getElementById('cityPopup').classList.remove('active');}

function init(){
  worldCanvas=document.getElementById('worldCanvas'); wctx=worldCanvas.getContext('2d');
  cityCanvas=document.getElementById('cityCanvas'); cctx=cityCanvas.getContext('2d');
  worldCanvas.width=worldCanvas.parentElement.clientWidth; worldCanvas.height=worldCanvas.parentElement.clientHeight;
  cityCanvas.width=400; cityCanvas.height=400;
  window.addEventListener('resize',()=>{worldCanvas.width=worldCanvas.parentElement.clientWidth; worldCanvas.height=worldCanvas.parentElement.clientHeight; drawWorld();});
  worldCanvas.addEventListener('click',e=>{
    let rect=worldCanvas.getBoundingClientRect(); let mx=e.clientX-rect.left, my=e.clientY-rect.top;
    let w=screenToWorld(mx,my); let city=cities.find(c=>Math.hypot(c.x-w.x,c.y-w.y)<15); if(city) openCity(cities.indexOf(city));
  });
  worldCanvas.addEventListener('wheel',e=>{e.preventDefault(); let d=e.deltaY>0?0.9:1.1; zoom=Math.max(0.8,Math.min(6,zoom*d)); drawWorld();},{passive:false});
  generateWorld();
}

function exportIntegrated(){
  let code=`# Integrated Map - World + Modern Cities Inside
# Place in src/World/Maps/IntegratedMap.gd
extends Resource
class_name IntegratedMap

const WORLD_SIZE = Vector2i(256,256)
const CITY_INTERIOR_SIZE = Vector2i(400,400)

# World cities are points, interiors are separate scenes that stream
const CITIES = [
${cities.map(c=>`  { id="${c.id}", name="${c.name}", world_pos=Vector2i(${Math.round(c.x)},${Math.round(c.y)}), type="${c.type}", pop=${c.pop}, is_modern=true, interior_scene="res://src/World/Cities/${c.id}.tscn", buildings=${c.buildings.length} }`).join(',\\n')}
]

# For ChunkManager: when camera within 30 tiles of city, load interior
func should_load_interior(world_pos: Vector2i, city_pos: Vector2i) -> bool:
  return world_pos.distance_to(city_pos) < 30

# Modern building types
enum ModernBuilding { GLASS_TOWER, MALL, RES_HIGH, SHOP, HOSPITAL, MOSQUE, PARK, POLICE }

const BUILDING_GLASS_MAT = preload("res://assets/materials/glass_reflective.tres")
const ROAD_ASPHALT_MAT = preload("res://assets/materials/asphalt_30m.tres")
`;
  let blob=new Blob([code],{type:'text/plain'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='IntegratedMap.gd';a.click();
}

window.addEventListener('load',init);
</script>
</body>
</html>
